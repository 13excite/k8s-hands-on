apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: testapp-4-route
  namespace: task-4
spec:
  parentRefs:
    - name: main-gw
      namespace: basic-gw 
  hostnames:
    - testapp4.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: testapp-4-svc
          port: 8081
